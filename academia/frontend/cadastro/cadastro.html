<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0f">
  <title>Criar conta | IRON FITNESS</title>
  <link rel="stylesheet" href="../comum/estilo.css">
</head>
<body>
  <main class="login-page">
    <section class="login-visual" aria-label="Ambiente da academia">
      <div class="visual-content">
        <span class="eyebrow">Disciplina. Força. Evolução.</span>
        <h1>COMECE A SUA<br><span>EVOLUÇÃO.</span></h1>
        <p>Crie a sua conta, escolha o plano e acompanhe treinos, aulas e pagamentos em um só lugar.</p>
      </div>
    </section>
    <section class="login-panel">
      <div class="login-top"><a class="brand" href="/inicio/" style="text-decoration:none"><div class="brand-mark">I</div><div class="brand-name">IRON <span>FITNESS</span></div></a></div>
      <div class="login-box">
        <span class="eyebrow">Novo aluno</span>
        <h2>Crie a sua conta.</h2>
        <p>Leva menos de um minuto. Depois você escolhe o plano.</p>
        <div id="planoEscolhido" class="alert" style="background:rgba(225,29,72,.10);border:1px solid var(--border-red);color:var(--text-primary)" hidden></div>
        <div id="mensagem" aria-live="polite"></div>
        <form class="login-form" id="formCadastro" novalidate>
          <div class="field"><label for="nome">Nome completo</label><input id="nome" type="text" maxlength="80" placeholder="Como está no seu documento" autocomplete="name" required></div>
          <div class="field"><label for="cpf">CPF</label><input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required></div>
          <div class="field"><label for="email">E-mail</label><input id="email" type="email" maxlength="80" placeholder="seuemail@exemplo.com" autocomplete="email" required></div>
          <div class="field"><label for="nascimento">Data de nascimento (opcional)</label><input id="nascimento" type="date" autocomplete="bday"></div>
          <div class="field"><label for="objetivo">Seu objetivo (opcional)</label><input id="objetivo" type="text" maxlength="100" list="listaObjetivos" placeholder="Ex.: Emagrecimento"><datalist id="listaObjetivos"><option value="Emagrecimento"><option value="Ganho de massa muscular"><option value="Condicionamento físico"><option value="Saúde e bem-estar"><option value="Reabilitação"></datalist></div>
          <div class="field"><label for="senha">Senha</label><div class="password-wrap"><input id="senha" type="password" minlength="6" maxlength="72" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" required><button class="toggle-password" type="button" id="toggleSenha">MOSTRAR</button></div></div>
          <div class="field"><label for="senha2">Repita a senha</label><input id="senha2" type="password" maxlength="72" placeholder="Digite a senha de novo" autocomplete="new-password" required></div>
          <button class="btn" type="submit" id="btnCadastrar">CRIAR MINHA CONTA <span aria-hidden="true">→</span></button>
        </form>
        <div class="login-foot" style="line-height:1.8">Já tem conta? <a href="/login/" style="color:var(--accent-red-bright);font-weight:600;text-decoration:none">Entrar</a></div>
      </div>
    </section>
  </main>
  <script src="../comum/sessao.js"></script><script src="../comum/imagens.js"></script><script src="cadastro.js"></script>
</body>
</html>
