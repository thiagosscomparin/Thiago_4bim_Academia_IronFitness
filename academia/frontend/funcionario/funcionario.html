<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funcionários | IRON FITNESS</title>
  <link rel="stylesheet" href="../comum/estilo.css">
  <link rel="stylesheet" href="../comum/crud.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <header class="topbar"><div class="topbar-title">IRON FITNESS / Funcionários</div><div class="topbar-actions"><button class="btn btn-secondary mobile-menu" id="menuBtn">☰</button><span class="muted" style="font-size:12px">Área Gerência</span></div></header>
    <section class="content">
      <div class="page-heading">
        <div><span class="eyebrow">Cadastros</span><h1>Funcionários</h1><p>Transforme uma pessoa cadastrada em funcionário, com cargo e salário.</p></div>
        <button class="btn" id="btnNovo">+ Novo funcionário</button>
      </div>
      <div class="toolbar"><input type="search" id="busca" placeholder="Buscar por nome, CPF ou cargo..."></div>
      <div class="panel"><div class="table-wrap"><table>
        <thead><tr><th>Funcionário</th><th>Cargo</th><th>Acesso</th><th>Salário</th><th>Admissão</th><th>Ações</th></tr></thead>
        <tbody id="tbFuncionarios"></tbody>
      </table></div></div>
    </section>
  </main>
</div>

<div class="modal-fundo" id="modalFuncionario">
  <div class="modal">
    <h2 id="tituloModal">Novo funcionário</h2>
    <form id="formFuncionario" novalidate>
      <div class="form-grid">
        <div class="field full"><label for="pessoa">Pessoa</label><select id="pessoa" required></select><small id="dicaPessoa">Só aparecem pessoas que ainda não são funcionárias. Cadastre antes em Pessoas.</small></div>
        <div class="field"><label for="cargo">Cargo</label><select id="cargo" required></select></div>
        <div class="field"><label for="salario">Salário (R$)</label><input id="salario" type="number" min="0" step="0.01"></div>
        <div class="field"><label for="admissao">Data de admissão</label><input id="admissao" type="date"></div>
      </div>
      <div class="alert alert-error" id="erroForm" hidden></div>
      <div class="modal-rodape">
        <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="../comum/sessao.js"></script>
<script src="../comum/imagens.js"></script>
<script src="../comum/menu.js"></script>
<script src="../comum/crud.js"></script>
<script src="funcionario.js"></script>
</body>
</html>
