<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu plano | IRON FITNESS</title>
  <link rel="stylesheet" href="../comum/estilo.css">
  <link rel="stylesheet" href="../comum/crud.css">
</head>
<body data-perfil="aluno">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <header class="topbar"><div class="topbar-title">IRON FITNESS / Meu plano</div><div class="topbar-actions"><button class="btn btn-secondary mobile-menu" id="menuBtn">☰</button><span class="muted" style="font-size:12px">Área do Aluno</span></div></header>
    <section class="content">
      <div class="page-heading">
        <div><span class="eyebrow">Meu espaço</span><h1>Meu plano</h1><p>Veja seu plano atual, contrate ou renove. Depois é só pagar pelo Pix.</p></div>
      </div>
      <div class="panel">
        <h3>Plano atual</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Item</th><th>Detalhe</th></tr></thead>
          <tbody id="tbAtual"></tbody>
        </table></div>
      </div>
      <div class="panel" style="margin-top:16px">
        <h3>Planos disponíveis</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Plano</th><th>Valor</th><th>Duração</th><th>Aulas coletivas</th><th>Ação</th></tr></thead>
          <tbody id="tbPlanos"></tbody>
        </table></div>
      </div>
      <div class="panel" style="margin-top:16px">
        <h3>Histórico de matrículas</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Plano</th><th>Início</th><th>Vencimento</th><th>Situação</th></tr></thead>
          <tbody id="tbHistorico"></tbody>
        </table></div>
      </div>
    </section>
  </main>
</div>

<script src="../comum/sessao.js"></script>
<script src="../comum/imagens.js"></script>
<script src="../comum/menu.js"></script>
<script src="../comum/crud.js"></script>
<script src="aluno_plano.js"></script>
</body>
</html>
