<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamentos | IRON FITNESS</title>
  <link rel="stylesheet" href="../comum/estilo.css">
  <link rel="stylesheet" href="../comum/crud.css">
  <link rel="stylesheet" href="pagamento.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <header class="topbar"><div class="topbar-title">IRON FITNESS / Pagamentos</div><div class="topbar-actions"><button class="btn btn-secondary mobile-menu" id="menuBtn">☰</button><span class="muted" style="font-size:12px">Área Gerência</span></div></header>
    <section class="content">
      <div class="page-heading">
        <div><span class="eyebrow">Financeiro</span><h1>Pagamentos</h1><p>Registre e confirme os pagamentos das matrículas.</p></div>
        <button class="btn" id="btnNovo">+ Novo pagamento</button>
      </div>
      <div class="toolbar">
        <input type="search" id="busca" placeholder="Buscar por nome ou CPF do aluno...">
        <div class="field" style="min-width:180px"><select id="filtroSituacao">
          <option value="">Todas as situações</option><option value="PENDENTE">Pendentes</option><option value="ATRASADO">Atrasados</option>
          <option value="PAGO">Pagos</option><option value="ESTORNADO">Estornados</option></select></div>
      </div>
      <div class="panel"><div class="table-wrap"><table>
        <thead><tr><th>Aluno</th><th>Plano</th><th>Valor</th><th>Forma</th><th>Data</th><th>Situação</th><th>Ações</th></tr></thead>
        <tbody id="tbPagamentos"></tbody>
      </table></div></div>
    </section>
  </main>
</div>

<!-- Cadastro / edição -->
<div class="modal-fundo" id="modalPagamento">
  <div class="modal">
    <h2 id="tituloModal">Novo pagamento</h2>
    <form id="formPagamento" novalidate>
      <div class="form-grid">
        <div class="field full"><label for="matricula">Matrícula</label><select id="matricula" required></select><small id="dicaMatricula">&nbsp;</small></div>
        <div class="field"><label for="forma">Forma de pagamento</label><select id="forma" required></select></div>
        <div class="field"><label for="valor">Valor (R$)</label><input id="valor" type="number" min="0.01" step="0.01" required></div>
        <div class="field full" id="blocoStatus"><label for="status">Situação</label><select id="status">
          <option value="PENDENTE">Pendente (aguardando pagamento)</option><option value="PAGO">Pago (já recebido)</option></select></div>
      </div>
      <div class="alert alert-error" id="erroForm" hidden></div>
      <div class="modal-rodape">
        <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- QR Code do Pix -->
<div class="modal-fundo" id="modalPix">
  <div class="modal" style="max-width:420px;text-align:center">
    <h2>Pagar com Pix</h2>
    <p class="muted" id="pixValor"></p>
    <img id="pixQr" alt="QR Code do Pix" width="260" height="260">
    <div class="field"><label for="pixCodigo">Pix copia e cola</label><textarea id="pixCodigo" rows="3" readonly></textarea></div>
    <small class="muted">O sistema não detecta o pagamento sozinho. Depois que o aluno pagar, clique em “Marcar como pago”.</small>
    <div class="modal-rodape">
      <button type="button" class="btn btn-secondary" id="btnCopiar">Copiar código</button>
      <button type="button" class="btn" id="btnFecharPix">Fechar</button>
    </div>
  </div>
</div>

<script src="../comum/sessao.js"></script>
<script src="../comum/imagens.js"></script>
<script src="../comum/menu.js"></script>
<script src="../comum/crud.js"></script>
<script src="pagamento.js"></script>
</body>
</html>
